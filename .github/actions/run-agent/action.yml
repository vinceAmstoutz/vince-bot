name: Run the bot's agent
description: Runs Claude Code in a checked-out repository with the bot's skills, without any GitHub token.

inputs:
  workdir:
    description: Checkout to work in
    required: true
  skill:
    description: Bot skill that drives the task
    required: true
  context-dir:
    description: Directory holding the task's prefetched context
    required: true
  out-dir:
    description: Directory the agent writes its outputs to
    required: true
  claude-code-oauth-token:
    description: Claude Code OAuth token
    required: false
  anthropic-api-key:
    description: Anthropic API key
    required: false
  max-turns:
    description: Maximum agent turns
    required: false
    default: "150"
  model:
    description: Model or alias (opus, sonnet, ...); empty keeps Claude Code's default
    required: false
    default: ""
  effort:
    description: Effort level (low, medium, high, xhigh, max); empty keeps the default
    required: false
    default: ""
  memory-key:
    description: Key that decrypts the bot's memory
    required: false
  federation-rule-id:
    description: Anthropic workload identity federation rule (fdrl_...); with organization-id, authenticates through GitHub OIDC instead of a stored key
    required: false
  organization-id:
    description: Anthropic organization UUID for workload identity federation
    required: false
  service-account-id:
    description: Anthropic service account (svac_...) for workload identity federation, optional
    required: false
  workspace-id:
    description: Anthropic workspace (wrkspc_...) for workload identity federation, optional
    required: false
  required-output:
    description: File the agent must write in out-dir
    required: false
    default: summary.md

runs:
  using: composite
  steps:
    - name: Install Claude Code
      shell: bash
      run: npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.319

    - name: Install the bot's skills
      shell: bash
      run: |
        mkdir -p "$HOME/.claude/skills" "$CONTEXT_DIR"
        cp -R "$GITHUB_ACTION_PATH/../../../skills/." "$HOME/.claude/skills/"
        learnings="$GITHUB_ACTION_PATH/../../../memory/LEARNINGS.md"
        if [ ! -e "$learnings" ] && [ -e "$learnings.enc" ] && [ -n "$BOT_MEMORY_KEY" ]; then
          sh "$GITHUB_ACTION_PATH/../../../scripts/memory.sh" decrypt "$(dirname "$learnings")" || echo '::warning::the memory could not be decrypted'
        fi
        if [ -e "$learnings" ]; then cp "$learnings" "$CONTEXT_DIR/LEARNINGS.md"; else : > "$CONTEXT_DIR/LEARNINGS.md"; fi
        mkdir -p "$OUT_DIR"
      env:
        CONTEXT_DIR: ${{ inputs.context-dir }}
        OUT_DIR: ${{ inputs.out-dir }}
        BOT_MEMORY_KEY: ${{ inputs.memory-key }}

    - name: Run the agent
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        AGENT_CONTEXT: ${{ inputs.context-dir }}
        AGENT_OUT: ${{ inputs.out-dir }}
        SKILL: ${{ inputs.skill }}
        MAX_TURNS: ${{ inputs.max-turns }}
        REQUIRED_OUTPUT: ${{ inputs.required-output }}
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        FEDERATION_RULE_ID: ${{ inputs.federation-rule-id }}
        ORGANIZATION_ID: ${{ inputs.organization-id }}
        SERVICE_ACCOUNT_ID: ${{ inputs.service-account-id }}
        WORKSPACE_ID: ${{ inputs.workspace-id }}
      run: |
        if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset CLAUDE_CODE_OAUTH_TOKEN; fi
        if [ -z "$ANTHROPIC_API_KEY" ]; then unset ANTHROPIC_API_KEY; fi
        if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}${ANTHROPIC_API_KEY:-}" ] && [ -n "$FEDERATION_RULE_ID" ] && [ -n "$ORGANIZATION_ID" ]; then
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || { echo '::error::workload identity federation needs the id-token: write permission'; exit 1; }
          federation=$(mktemp -d "$RUNNER_TEMP/federation-XXXXXX")
          chmod 700 "$federation"
          fetch_identity_token() {
            curl -fsS --retry 3 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > "$federation/identity-token.new"
            chmod 600 "$federation/identity-token.new"
            mv "$federation/identity-token.new" "$federation/identity-token"
          }
          fetch_identity_token
          mkdir -p "$federation/config/configs"
          printf '{"version": "1.0", "authentication": {"type": "oidc_federation"}}\n' > "$federation/config/configs/default.json"
          chmod 600 "$federation/config/configs/default.json"
          export ANTHROPIC_IDENTITY_TOKEN_FILE="$federation/identity-token" ANTHROPIC_CONFIG_DIR="$federation/config" ANTHROPIC_PROFILE=default
          export ANTHROPIC_FEDERATION_RULE_ID="$FEDERATION_RULE_ID" ANTHROPIC_ORGANIZATION_ID="$ORGANIZATION_ID"
          if [ -n "$SERVICE_ACCOUNT_ID" ]; then export ANTHROPIC_SERVICE_ACCOUNT_ID="$SERVICE_ACCOUNT_ID"; fi
          if [ -n "$WORKSPACE_ID" ]; then export ANTHROPIC_WORKSPACE_ID="$WORKSPACE_ID"; fi
          ( while sleep 240; do fetch_identity_token || echo '::warning::the OIDC identity token could not be refreshed'; done ) &
          refresher=$!
          trap 'kill "$refresher" 2>/dev/null; rm -rf "$federation"' EXIT
          echo 'Authenticating to Claude through workload identity federation.'
        fi
        set -- --max-turns "$MAX_TURNS" --permission-mode acceptEdits --output-format text \
          --allowedTools "Bash Read Write Edit MultiEdit Glob Grep WebFetch WebSearch Skill TodoWrite"
        if [ -n "$MODEL" ]; then set -- "$@" --model "$MODEL"; fi
        if [ -n "$EFFORT" ]; then set -- "$@" --effort "$EFFORT"; fi
        log="$RUNNER_TEMP/agent-$SKILL-$(date +%s).log"
        if ! claude -p "Use the $SKILL skill to carry out your task. The task's context is in \$AGENT_CONTEXT ($AGENT_CONTEXT); write your outputs to \$AGENT_OUT ($AGENT_OUT)." "$@" > "$log" 2>&1; then
          echo "::error::the agent stopped with an error (its output stays off the public log)"
          exit 1
        fi
        echo "The agent finished; its output stays off the public log."
        test -s "$AGENT_OUT/$REQUIRED_OUTPUT" || { echo "::error::the agent did not write $REQUIRED_OUTPUT"; exit 1; }
