name: Bot production errors

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: errors
  cancel-in-progress: false

jobs:
  select:
    name: Find new production errors
    if: (github.event_name == 'schedule' || github.actor == github.repository_owner) && vars.BOT_BUGSINK_URL != ''
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Create the read token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.BOT_REPOSITORIES }}
          permission-issues: read
          permission-pull-requests: read

      - name: Select open errors the bot has not handled yet
        id: select
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          REPOSITORIES: ${{ vars.BOT_REPOSITORIES }}
          PROJECTS: ${{ vars.BOT_BUGSINK_PROJECTS }}
          BUGSINK_URL: ${{ vars.BOT_BUGSINK_URL }}
          BUGSINK_TOKEN: ${{ secrets.BUGSINK_TOKEN }}
        run: |
          selected='[]'
          for pair in $(printf '%s' "$PROJECTS" | tr ',' ' '); do
            repo=${pair%%=*} project=${pair#*=}
            case ",$REPOSITORIES," in *",$repo,"*) ;; *) echo '::warning::a Bugsink project maps to a repository outside BOT_REPOSITORIES'; continue;; esac
            case "$project" in ''|*[!0-9]*) echo '::warning::a Bugsink project id is not numeric'; continue;; esac
            handled=$(gh api "repos/$OWNER/$repo/issues?state=all&creator=$SLUG%5Bbot%5D&per_page=100" --paginate \
              | jq -rs '[add[] | .body // "" | scan("vince-bot:error:([0-9a-f-]+)") | .[0]] | unique')
            errors=$(curl -fsS --max-time 30 -H "Authorization: Bearer $BUGSINK_TOKEN" \
              "$BUGSINK_URL/api/canonical/0/issues/?project=$project&state=open&sort=last_seen&order=desc" \
              | jq -c --argjson handled "$handled" '[.results[] | select(.id as $id | $handled | index($id) | not) | .id]')
            selected=$(printf '%s' "$selected" | jq -c --arg repo "$repo" --argjson errors "$errors" '. + [$errors[] | {repository: $repo, reference: .}]')
          done
          echo "Found $(printf '%s' "$selected" | jq length) new production errors."
          echo "matrix=$(printf '%s' "$selected" | jq -c '.[:2]')" >> "$GITHUB_OUTPUT"

  fix:
    name: Fix the production error
    needs: select
    if: needs.select.outputs.matrix != '[]' && needs.select.outputs.matrix != ''
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    uses: ./.github/workflows/work.yaml
    with:
      repository: ${{ matrix.repository }}
      kind: error
      reference: ${{ matrix.reference }}
    secrets:
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BOT_MEMORY_KEY: ${{ secrets.BOT_MEMORY_KEY }}
      BUGSINK_TOKEN: ${{ secrets.BUGSINK_TOKEN }}
