name: Bot work

on:
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      number:
        type: number
        required: false
        default: 0
      kind:
        type: string
        required: true
      request:
        type: string
        required: false
        default: ""
      reference:
        type: string
        required: false
        default: ""
      reply-to:
        type: string
        required: false
        default: ""
    secrets:
      BOT_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      BOT_MEMORY_KEY:
        required: false
      BUGSINK_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      repository:
        description: Repository name, under the same owner
        type: string
        required: true
      number:
        description: Issue or pull request number (0 for error and page)
        type: number
        required: false
        default: 0
      kind:
        description: What the number is
        type: choice
        options:
          - pull-request
          - issue
          - error
          - page
        required: true
      request:
        description: What to do (empty on a pull request means make its CI green; the measurements for a page)
        type: string
        required: false
      reference:
        description: The Bugsink issue id (error) or the page path (page)
        type: string
        required: false
      reply-to:
        description: The first comment of the code review thread to answer in (pull-request only)
        type: string
        required: false

permissions: {}

jobs:
  work:
    name: Work on ${{ inputs.repository }} ${{ inputs.kind }} ${{ inputs.number || inputs.reference }}
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: work-${{ inputs.repository }}-${{ inputs.kind }}-${{ inputs.number || inputs.reference }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bot
          persist-credentials: false

      - name: Check the inputs
        env:
          REPOSITORY: ${{ inputs.repository }}
          KIND: ${{ inputs.kind }}
          NUMBER: ${{ inputs.number }}
          REFERENCE: ${{ inputs.reference }}
          ALLOWED: ${{ vars.BOT_REPOSITORIES }}
          OWN_REPOSITORY: ${{ github.event.repository.name }}
          REPLY_TO: ${{ inputs.reply-to }}
        run: |
          case "$REPLY_TO" in *[!0-9]*) echo '::error::reply-to must be a comment id'; exit 1;; esac
          case ",$ALLOWED,$OWN_REPOSITORY," in *",$REPOSITORY,"*) ;; *) echo "::error::$REPOSITORY is not in BOT_REPOSITORIES"; exit 1;; esac
          case "$KIND" in pull-request|issue) ;; error|page) ;; *) echo "::error::unknown kind $KIND"; exit 1;; esac
          case "$KIND" in
            error) case "$REFERENCE" in ''|*[!0-9a-f-]*) echo '::error::reference must be a Bugsink issue id'; exit 1;; esac ;;
            page) case "$REFERENCE" in /*) ;; *) echo '::error::reference must be a page path'; exit 1;; esac
                  case "$REFERENCE" in *[!A-Za-z0-9/._~%-]*) echo '::error::reference must be a plain path'; exit 1;; esac ;;
            *) case "$NUMBER" in ''|0|*[!0-9]*) echo '::error::number is required'; exit 1;; esac ;;
          esac
          { echo "CONTEXT=$RUNNER_TEMP/context"; echo "OUT=$RUNNER_TEMP/out"; } >> "$GITHUB_ENV"

      - name: Create the read token
        id: read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.repository }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Fetch the task's context
        id: context
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repository }}
          NUMBER: ${{ inputs.number }}
          KIND: ${{ inputs.kind }}
          REQUEST: ${{ inputs.request }}
          REFERENCE: ${{ inputs.reference }}
          REPLY_TO: ${{ inputs.reply-to }}
          BUGSINK_URL: ${{ vars.BOT_BUGSINK_URL }}
          BUGSINK_TOKEN: ${{ secrets.BUGSINK_TOKEN }}
        run: |
          mkdir -p "$CONTEXT" "$OUT"
          printf '%s\n' "${REQUEST:-Make the failing CI checks of this pull request pass.}" > "$CONTEXT/request.md"
          if [ "$KIND" = pull-request ] || [ "$KIND" = issue ]; then
            jq -n --argjson issue "$(gh api "repos/$REPO/issues/$NUMBER")" --argjson comments "$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate | jq -s add)" \
              '{issue: $issue, comments: $comments}' > "$CONTEXT/thread.json"
          fi
          if [ -n "$REPLY_TO" ]; then
            gh api "repos/$REPO/pulls/$NUMBER/comments" --paginate | jq -s add \
              | jq --argjson root "$REPLY_TO" '[.[] | select(.id == $root or .in_reply_to_id == $root)] | sort_by(.created_at)
                  | {path: .[0].path, line: (.[0].line // .[0].original_line), start_line: .[0].start_line, diff_hunk: .[0].diff_hunk,
                     comments: [.[] | {author: .user.login, body, created_at}]}' > "$CONTEXT/review-thread.json"
          fi
          if [ "$KIND" = error ]; then
            bugsink() { curl -fsS --max-time 30 -H "Authorization: Bearer $BUGSINK_TOKEN" "$BUGSINK_URL/api/canonical/0/$1"; }
            issue=$(bugsink "issues/$REFERENCE/")
            events=$(bugsink "events/?issue=$REFERENCE&order=desc" | jq '.results[:5]')
            latest=$(printf '%s' "$events" | jq -r '.[0].id // empty')
            { echo '# Production error'
              echo
              echo '## Issue'
              echo '```json'; printf '%s\n' "$issue" | jq .; echo '```'
              echo
              echo '## Latest events'
              echo '```json'; printf '%s\n' "$events" | jq .; echo '```'
              echo
              echo '## Stack trace of the latest event'
              echo
              if [ -n "$latest" ]; then bugsink "events/$latest/stacktrace/" | jq -r . 2>/dev/null || bugsink "events/$latest/stacktrace/"; fi
            } > "$CONTEXT/error.md"
            echo "title=$(printf '%s' "$issue" | jq -r '[.calculated_type, (if (.transaction // "") != "" then "in " + .transaction else empty end)] | join(" ") | .[:90]')" >> "$GITHUB_OUTPUT"
          fi
          if [ "$KIND" = page ]; then
            echo "title=Slow page: $REFERENCE" >> "$GITHUB_OUTPUT"
          fi
          if [ "$KIND" = pull-request ]; then
            gh pr view "$NUMBER" -R "$REPO" --json number,title,body,author,url,headRefName,headRefOid,baseRefName,isCrossRepository,files,statusCheckRollup > "$CONTEXT/pull-request.json"
            if [ "$(jq -r .isCrossRepository "$CONTEXT/pull-request.json")" = true ]; then echo '::error::the bot does not push to forks'; exit 1; fi
            : > "$CONTEXT/failed-checks.md"
            jq -c '.statusCheckRollup[] | select((.conclusion // .state) as $s | ["FAILURE","ERROR","TIMED_OUT","STARTUP_FAILURE","ACTION_REQUIRED"] | index($s))' "$CONTEXT/pull-request.json" \
              | while IFS= read -r check; do
                  name=$(printf '%s' "$check" | jq -r '.name // .context')
                  url=$(printf '%s' "$check" | jq -r '.detailsUrl // .targetUrl // ""')
                  printf '## %s\n\n%s\n\n' "$name" "$url" >> "$CONTEXT/failed-checks.md"
                  job=$(printf '%s' "$url" | sed -n 's|.*/actions/runs/[0-9]*/job/\([0-9]*\).*|\1|p')
                  if [ -n "$job" ]; then
                    { echo '```text'; gh api "repos/$REPO/actions/jobs/$job/logs" 2>/dev/null | tail -n 250; echo '```'; echo; } >> "$CONTEXT/failed-checks.md"
                  fi
                done
            { echo "ref=$(jq -r .headRefName "$CONTEXT/pull-request.json")"
              echo "head=$(jq -r .headRefOid "$CONTEXT/pull-request.json")"
              echo "branch=$(jq -r .headRefName "$CONTEXT/pull-request.json")"; } >> "$GITHUB_OUTPUT"
          else
            default=$(gh api "repos/$REPO" --jq .default_branch)
            { echo "ref=$default"
              echo "head=$(gh api "repos/$REPO/commits/$default" --jq .sha)"
              echo "base=$default"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.repository }}
          ref: ${{ steps.context.outputs.head }}
          token: ${{ steps.read-token.outputs.token }}
          path: target
          persist-credentials: false

      - name: Do the work
        uses: ./bot/.github/actions/run-agent
        with:
          workdir: target
          skill: ${{ (inputs.kind == 'error' && 'fixing-a-production-error') || (inputs.kind == 'page' && 'finding-performance-issues') || (inputs.kind == 'pull-request' && inputs.request == '' && 'fixing-a-pull-request') || 'handling-a-request' }}
          context-dir: ${{ env.CONTEXT }}
          out-dir: ${{ env.OUT }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          memory-key: ${{ secrets.BOT_MEMORY_KEY }}
          federation-rule-id: ${{ vars.BOT_ANTHROPIC_FEDERATION_RULE_ID }}
          organization-id: ${{ vars.BOT_ANTHROPIC_ORGANIZATION_ID }}
          service-account-id: ${{ vars.BOT_ANTHROPIC_SERVICE_ACCOUNT_ID }}
          workspace-id: ${{ vars.BOT_ANTHROPIC_WORKSPACE_ID }}
          model: ${{ vars.BOT_WORK_MODEL || 'opus' }}

      - name: Check everything before it is published
        uses: ./bot/.github/actions/run-agent
        with:
          workdir: target
          skill: checking-before-posting
          context-dir: ${{ env.CONTEXT }}
          out-dir: ${{ env.OUT }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          memory-key: ${{ secrets.BOT_MEMORY_KEY }}
          federation-rule-id: ${{ vars.BOT_ANTHROPIC_FEDERATION_RULE_ID }}
          organization-id: ${{ vars.BOT_ANTHROPIC_ORGANIZATION_ID }}
          service-account-id: ${{ vars.BOT_ANTHROPIC_SERVICE_ACCOUNT_ID }}
          workspace-id: ${{ vars.BOT_ANTHROPIC_WORKSPACE_ID }}
          model: ${{ vars.BOT_WORK_MODEL || 'opus' }}
          required-output: verdict.json
          max-turns: "80"

      - name: Create the write token
        id: write-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.repository }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Publish
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repository }}
          NUMBER: ${{ inputs.number }}
          KIND: ${{ inputs.kind }}
          HEAD: ${{ steps.context.outputs.head }}
          PR_BRANCH: ${{ steps.context.outputs.branch }}
          BASE: ${{ steps.context.outputs.base }}
          SLUG: ${{ steps.write-token.outputs.app-slug }}
          REFERENCE: ${{ inputs.reference }}
          TITLE: ${{ steps.context.outputs.title }}
          REPLY_TO: ${{ inputs.reply-to }}
          BUGSINK_URL: ${{ vars.BOT_BUGSINK_URL }}
          BUGSINK_TOKEN: ${{ secrets.BUGSINK_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          footer=$(printf '\n\n---\n_Posted by vinceAmstoutz GitHub AI bot · [run](%s)_' "$RUN_URL")
          marker="<!-- vince-bot:$KIND:$REFERENCE -->"
          summary=$(cat "$OUT/summary.md")
          reply() {
            text=$(python3 -I -c 'import sys; t = " ".join(sys.argv[1].split()); print(t if len(t) <= 200 else t[:199] + "…")' "$1")
            gh api "repos/$REPO/pulls/$NUMBER/comments/$REPLY_TO/replies" -f body="$text" --silent
          }
          report() {
            if [ "$KIND" = error ] || [ "$KIND" = page ]; then
              gh api "repos/$REPO/issues" -f title="$TITLE" -f body="$1

          $marker$footer" --silent
            elif [ -n "$REPLY_TO" ]; then
              reply "$(head -n 1 "$OUT/reply.md" 2>/dev/null || printf '%s' "$1" | head -n 1)"
            else
              gh api "repos/$REPO/issues/$NUMBER/comments" -f body="$1$footer" --silent
            fi
          }
          if [ "$(jq -r '.approved' "$OUT/verdict.json")" != true ]; then
            problems=$(jq -r '.problems[] | "- " + .' "$OUT/verdict.json")
            if [ -n "$REPLY_TO" ]; then
              reply "❓ Nothing pushed: $(jq -r '.problems[0] // "the check refused the change"' "$OUT/verdict.json")"
              exit 0
            fi
            report "@vinceAmstoutz I could not finish this, so nothing was committed.

          $problems

          $summary"
            exit 0
          fi
          if [ "$(git -C target rev-parse HEAD)" != "$HEAD" ]; then
            echo '::warning::the agent committed locally; its changes go into the signed commit instead'
            git -C target reset -q --soft "$HEAD"
          fi
          if [ -z "$(git -C target status --porcelain)" ]; then
            report "$summary"
            exit 0
          fi
          test -s "$OUT/commit-message.txt" || { echo '::error::changes without a commit message'; exit 1; }
          if [ "$KIND" = pull-request ]; then
            branch=$PR_BRANCH
            if [ "$(gh api "repos/$REPO/git/ref/heads/$branch" --jq .object.sha)" != "$HEAD" ]; then
              if [ -n "$REPLY_TO" ]; then
                reply "⏭️ The branch moved while I worked, so I pushed nothing. Ask again if it is still needed."
              else
                report "The branch moved while I worked, so I pushed nothing. Ask again if it is still needed."
              fi
              exit 0
            fi
          else
            branch="$SLUG/$KIND-${NUMBER#0}$(printf '%s' "$REFERENCE" | tr -c 'A-Za-z0-9' '-' | cut -c1-40)-$GITHUB_RUN_ID"
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$HEAD" > /dev/null
          fi
          created=$(bash bot/scripts/commit-payload.sh target "$REPO" "$branch" "$HEAD" "$(cat "$OUT/commit-message.txt")" \
            | gh api graphql --input - --jq '.data.createCommitOnBranch.commit | .oid + " " + .url')
          sh bot/scripts/assert-verified.sh "$REPO" "${created%% *}"
          commit=${created#* }
          if [ "$KIND" = pull-request ] && [ -n "$REPLY_TO" ]; then
            done_line=$(head -n 1 "$OUT/reply.md" 2>/dev/null || echo '✅ Done.')
            reply "$(python3 -I -c 'import sys; t = " ".join(sys.argv[1].split()); print(t if len(t) <= 188 else t[:187] + "…")' "$done_line") $(printf '%.7s' "${created%% *}")"
          elif [ "$KIND" = pull-request ]; then
            report "$summary

          Pushed $commit"
          elif [ "$KIND" = issue ]; then
            test -s "$OUT/pull-request.json" || { echo '::error::no pull-request.json for the issue'; exit 1; }
            pr=$(gh api "repos/$REPO/pulls" -f head="$branch" -f base="$BASE" \
              -f title="$(jq -r .title "$OUT/pull-request.json")" \
              -f body="$(jq -r .body "$OUT/pull-request.json")

          Closes #$NUMBER$footer" --jq .html_url)
            gh api "repos/$REPO/issues/$NUMBER/comments" -f body="$summary

          Opened $pr$footer" --silent
          else
            test -s "$OUT/pull-request.json" || { echo '::error::no pull-request.json'; exit 1; }
            pr=$(gh api "repos/$REPO/pulls" -f head="$branch" -f base="$BASE" \
              -f title="$(jq -r .title "$OUT/pull-request.json")" \
              -f body="$(jq -r .body "$OUT/pull-request.json")

          $marker$footer" --jq .html_url)
            if [ "$KIND" = error ]; then
              jq -n --arg issue "$REFERENCE" --arg comment "vinceAmstoutz GitHub AI bot opened a fix: $pr" '{issue: $issue, comment: $comment}' \
                | curl -fsS --max-time 30 -o /dev/null -H "Authorization: Bearer $BUGSINK_TOKEN" -H 'Content-Type: application/json' \
                    -X POST --data @- "$BUGSINK_URL/api/canonical/0/issue-comments/" \
                || echo '::warning::the Bugsink issue could not be commented'
            fi
          fi

      - name: Report a failure
        if: failure()
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: failure-token
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.repository }}
          permission-issues: write
          permission-pull-requests: write

      - name: Comment the failure
        if: failure() && steps.failure-token.outputs.token != '' && inputs.number > 0
        env:
          GH_TOKEN: ${{ steps.failure-token.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repository }}
          NUMBER: ${{ inputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$REPO/issues/$NUMBER/comments" -f body="@vinceAmstoutz the bot failed on this before publishing anything: see the [run]($RUN_URL).

          ---
          _Posted by vinceAmstoutz GitHub AI bot_" --silent
