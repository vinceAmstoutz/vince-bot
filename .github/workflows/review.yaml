name: Bot review

on:
  schedule:
    - cron: "11,41 * * * *"
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      repository:
        description: Repository of a single pull request to review (sent by the repository's bot-review workflow)
        required: false
        type: string
      number:
        description: Number of that pull request
        required: false
        type: string
      again:
        description: Review it again even when its head commit was already reviewed
        required: false
        type: boolean
        default: false
      description-only:
        description: Only give the description the owner's format again, without posting a review (sent when the description changed during a review)
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: review-${{ inputs.repository || (github.event_name == 'pull_request' && github.event.repository.name) || 'scan' }}-${{ inputs.number || github.event.pull_request.number || 'all' }}
  cancel-in-progress: false

jobs:
  select:
    name: Find the owner's and the bot's pull requests to review
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && (github.actor == github.repository_owner || github.actor_id == '41898282'))
      || (github.event_name == 'pull_request' && !github.event.pull_request.draft
          && github.event.pull_request.head.repo.full_name == github.repository
          && (github.event.pull_request.user.login == github.repository_owner || github.event.pull_request.user.login == 'vinceamstoutz-github-ai-bot[bot]'))
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Create the read token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ (github.event_name == 'pull_request' && github.event.repository.name) || vars.BOT_REPOSITORIES }}
          permission-checks: read
          permission-pull-requests: read

      - name: Select pull requests whose head the bot has not reviewed
        id: select
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          REPOSITORIES: ${{ vars.BOT_REPOSITORIES }}
          ONLY_REPOSITORY: ${{ inputs.repository || (github.event_name == 'pull_request' && github.event.repository.name) || '' }}
          ONLY_NUMBER: ${{ inputs.number || github.event.pull_request.number || '' }}
          OWN_REPOSITORY: ${{ github.event.repository.name }}
          AGAIN: ${{ inputs.again && inputs.number != '' }}
        run: |
          selected='[]'
          if [ -n "$ONLY_NUMBER" ]; then
            case "$ONLY_NUMBER" in *[!0-9]*) echo '::error::number must be numeric'; exit 1;; esac
            case ",$REPOSITORIES,$OWN_REPOSITORY," in *",$ONLY_REPOSITORY,"*) ;; *) echo '::error::repository is not in BOT_REPOSITORIES'; exit 1;; esac
            REPOSITORIES=$ONLY_REPOSITORY
          fi
          for repo in $(printf '%s' "$REPOSITORIES" | tr ',' ' '); do
            prs=$(gh pr list -R "$OWNER/$repo" --state open --limit 50 --json number,headRefOid,isDraft,isCrossRepository,author \
              | jq -c --arg owner "$OWNER" --arg bot "app/$SLUG" '[.[] | select((.isDraft or .isCrossRepository) | not) | select(.author.login == $owner or .author.login == $bot)]')
            if [ -n "$ONLY_NUMBER" ]; then prs=$(printf '%s' "$prs" | jq -c --argjson n "$ONLY_NUMBER" '[.[] | select(.number == $n)]'); fi
            while IFS= read -r row; do
              sha=$(printf '%s' "$row" | jq -r .headRefOid)
              done=$(gh api "repos/$OWNER/$repo/commits/$sha/check-runs?check_name=Bot%20review" --jq .total_count)
              if [ "$done" = 0 ] || [ "$AGAIN" = true ]; then
                selected=$(printf '%s' "$selected" | jq -c --arg repo "$repo" --argjson row "$row" '. + [{repository: $repo, number: $row.number, head: $row.headRefOid}]')
              fi
            done < <(printf '%s' "$prs" | jq -c '.[] | {number, headRefOid}')
          done
          echo "matrix=$(printf '%s' "$selected" | jq -c '.[:6]')" >> "$GITHUB_OUTPUT"

  review:
    name: Review ${{ matrix.repository }}#${{ matrix.number }}
    needs: select
    if: needs.select.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout the bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bot
          persist-credentials: false

      - name: Create the read token
        id: read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repository }}
          permission-contents: read
          permission-pull-requests: read

      - name: Fetch the pull request
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ matrix.repository }}
          NUMBER: ${{ matrix.number }}
          SLUG: ${{ steps.read-token.outputs.app-slug }}
        run: |
          { echo "CONTEXT=$RUNNER_TEMP/context"; echo "OUT=$RUNNER_TEMP/out"; } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/context" "$RUNNER_TEMP/out"
          gh pr view "$NUMBER" -R "$REPO" --json number,title,body,author,url,headRefName,headRefOid,baseRefName,files,commits > "$RUNNER_TEMP/context/pull-request.json"
          jq -r '.body // ""' "$RUNNER_TEMP/context/pull-request.json" | awk '/github-pr-review-description:start/{f=1} f; /github-pr-review-description:end/{f=0}' > "$RUNNER_TEMP/block.md"
          if [ ! -s "$RUNNER_TEMP/block.md" ]; then
            echo 'The description has no bot description block yet: write it.' > "$RUNNER_TEMP/context/description-notes.md"
          elif ! grep -q 'Before → ' "$RUNNER_TEMP/block.md"; then
            echo 'The bot description block has no Before → After list: add one unless no user does, sees or gets anything different (docs wording, links or formatting, pure refactor, tooling).' > "$RUNNER_TEMP/context/description-notes.md"
          fi
          gh api "repos/$REPO/pulls/$NUMBER/files" --paginate | jq -s add > "$RUNNER_TEMP/context/files.json"
          gh api graphql -F owner="${REPO%/*}" -F name="${REPO#*/}" -F number="$NUMBER" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviewThreads(first: 100) {
                    nodes { id isResolved isOutdated path line originalLine comments(first: 20) { nodes { author { login } body } } }
                  }
                }
              }
            }' \
            | jq --arg bot "$SLUG" '[.data.repository.pullRequest.reviewThreads.nodes[]
                | select(.comments.nodes[0].author.login as $author | $author == $bot or $author == ($bot + "[bot]"))
                | {id, isResolved, isOutdated, path, line: (.line // .originalLine), finding: .comments.nodes[0].body,
                   replies: [.comments.nodes[1:][] | {author: .author.login, body}]}]' > "$RUNNER_TEMP/context/previous-threads.json"
          printf 'Review this pull request.\n' > "$RUNNER_TEMP/context/request.md"

      - name: Checkout the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repository }}
          ref: ${{ matrix.head }}
          token: ${{ steps.read-token.outputs.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Review
        uses: ./bot/.github/actions/run-agent
        with:
          workdir: target
          skill: reviewing-pull-requests
          context-dir: ${{ env.CONTEXT }}
          out-dir: ${{ env.OUT }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          memory-key: ${{ secrets.BOT_MEMORY_KEY }}
          federation-rule-id: ${{ vars.BOT_ANTHROPIC_FEDERATION_RULE_ID }}
          organization-id: ${{ vars.BOT_ANTHROPIC_ORGANIZATION_ID }}
          service-account-id: ${{ vars.BOT_ANTHROPIC_SERVICE_ACCOUNT_ID }}
          workspace-id: ${{ vars.BOT_ANTHROPIC_WORKSPACE_ID }}
          model: ${{ vars.BOT_REVIEW_MODEL || 'sonnet' }}
          effort: ${{ vars.BOT_REVIEW_EFFORT || 'medium' }}
          required-output: review.json
          max-turns: "80"

      - name: Check the review before it is posted
        uses: ./bot/.github/actions/run-agent
        with:
          workdir: target
          skill: checking-before-posting
          context-dir: ${{ env.CONTEXT }}
          out-dir: ${{ env.OUT }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          memory-key: ${{ secrets.BOT_MEMORY_KEY }}
          federation-rule-id: ${{ vars.BOT_ANTHROPIC_FEDERATION_RULE_ID }}
          organization-id: ${{ vars.BOT_ANTHROPIC_ORGANIZATION_ID }}
          service-account-id: ${{ vars.BOT_ANTHROPIC_SERVICE_ACCOUNT_ID }}
          workspace-id: ${{ vars.BOT_ANTHROPIC_WORKSPACE_ID }}
          model: ${{ vars.BOT_REVIEW_MODEL || 'sonnet' }}
          effort: ${{ vars.BOT_REVIEW_EFFORT || 'medium' }}
          required-output: verdict.json
          max-turns: "40"

      - name: Create the write token
        id: write-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repository }}
          permission-checks: write
          permission-pull-requests: write

      - name: Post the review
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ matrix.repository }}
          NUMBER: ${{ matrix.number }}
          HEAD: ${{ matrix.head }}
          SLUG: ${{ steps.write-token.outputs.app-slug }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DESCRIPTION_ONLY: ${{ inputs.description-only == true }}
          DISPATCH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.repository }}
        run: |
          payload=$(python3 -I bot/scripts/review-payload.py "$OUT/review.json" "$CONTEXT/files.json" "$HEAD" "_Reviewed by vinceAmstoutz GitHub AI bot · [run]($RUN_URL)_")
          if [ "$DESCRIPTION_ONLY" = true ]; then
            payload=''
            echo 'Description pass only: no review posted.'
          fi
          if [ -n "$payload" ]; then
            printf '%s' "$payload" | gh api "repos/$REPO/pulls/$NUMBER/reviews" --input - --silent
            echo "Posted a review with $(printf '%s' "$payload" | jq '.comments | length') inline comments."
            conclusion=neutral
          else
            conclusion=success
          fi
          resolved='[]'
          for thread in $(jq -r '.resolve // [] | .[]' "$OUT/review.json"); do
            jq -e --arg id "$thread" 'any(.[]; .id == $id and (.isResolved | not))' "$CONTEXT/previous-threads.json" > /dev/null || continue
            if gh api graphql -f id="$thread" -f query='mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { isResolved } } }' --silent; then
              resolved=$(printf '%s' "$resolved" | jq -c --arg id "$thread" '. + [$id]')
            else
              echo '::warning::a fixed review thread could not be resolved'
            fi
          done
          echo "Resolved $(printf '%s' "$resolved" | jq length) fixed review threads."
          if [ -s "$OUT/pr-body.md" ] && [ "$(jq -r .approved "$OUT/verdict.json")" = true ]; then
            current=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""')
            if [ "$current" = "$(jq -r '.body // ""' "$CONTEXT/pull-request.json")" ]; then
              gh api -X PATCH "repos/$REPO/pulls/$NUMBER" -F body=@"$OUT/pr-body.md" --silent
            else
              echo 'The description changed during the review: giving the current one the format again in a minute.'
              sleep 60
              GH_TOKEN=$DISPATCH_TOKEN gh workflow run review.yaml -R "$GITHUB_REPOSITORY" \
                -f repository="$TARGET" -f number="$NUMBER" -f again=true -f description-only=true
            fi
          fi
          if [ "$DESCRIPTION_ONLY" != true ]; then
            gh api "repos/$REPO/check-runs" -f name='Bot review' -f head_sha="$HEAD" -f status=completed -f conclusion="$conclusion" \
              -f "output[title]=$(jq -r '.summary' "$OUT/review.json" | head -n 1 | sed -E 's/^[-*#> ]+//; s/\*\*|__|`//g' | cut -c1-120)" -f "output[summary]=$(cat "$OUT/summary.md")" --silent
          fi
