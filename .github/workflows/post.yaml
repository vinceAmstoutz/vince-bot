name: Post as vinceAmstoutz GitHub AI bot

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository of the owner to post in (name only, e.g. symfony-security-auditor)
        required: true
        type: string
      action:
        description: What the bot posts
        required: true
        type: choice
        options:
          - create-issue
          - create-pull-request
          - comment
      number:
        description: Issue or pull request to comment on (comment only)
        required: false
        type: string
      head:
        description: Branch holding the changes (create-pull-request only)
        required: false
        type: string
      base:
        description: Branch to merge into (create-pull-request only)
        required: false
        type: string
      title:
        description: Issue or pull request title
        required: false
        type: string
      body:
        description: Markdown body of the issue, pull request or comment
        required: true
        type: string
      labels:
        description: Comma-separated labels (issue or pull request)
        required: false
        type: string

permissions: {}

jobs:
  post:
    name: Post as vinceAmstoutz GitHub AI bot
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the target repository
        env:
          REPOSITORY: ${{ inputs.repository }}
        run: |
          case "$REPOSITORY" in ''|*[!A-Za-z0-9._-]*) echo '::error::repository must be a bare repository name'; exit 1;; esac

      - name: Create the bot token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.repository }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Create the issue
        if: inputs.action == 'create-issue'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository_owner }}/${{ inputs.repository }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          LABELS: ${{ inputs.labels }}
        run: |
          test -n "$TITLE" || { echo '::error::create-issue needs a title'; exit 1; }
          set -- --title "$TITLE" --body "$BODY"
          if [ -n "$LABELS" ]; then set -- "$@" --label "$LABELS"; fi
          gh issue create "$@" > /dev/null
          echo 'Opened the issue.'

      - name: Checkout the bot
        if: inputs.action == 'create-pull-request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bot
          persist-credentials: false

      - name: Replace the branch's unsigned commits with one signed commit
        if: inputs.action == 'create-pull-request'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repository }}
          HEAD: ${{ inputs.head }}
          BASE: ${{ inputs.base }}
        run: |
          case "$HEAD/$BASE" in *[!A-Za-z0-9._/-]*) echo '::error::head and base must be branch names'; exit 1;; esac
          head_sha=$(gh api "repos/$REPO/commits/$HEAD" --jq .sha)
          compare=$(gh api "repos/$REPO/compare/$BASE...$head_sha")
          if [ "$(printf '%s' "$compare" | jq '[.commits[] | select(.commit.verification.verified | not)] | length')" = 0 ]; then
            echo 'Every commit is already signed.'; exit 0
          fi
          parent=$(printf '%s' "$compare" | jq -r .merge_base_commit.sha)
          message=$(gh api "repos/$REPO/commits/$head_sha" --jq .commit.message)
          gh auth setup-git
          git init -q target
          git -C target fetch -q --depth=1 "https://github.com/$REPO" "$parent" "$head_sha"
          git -C target checkout -q "$parent"
          git -C target read-tree -u --reset "$head_sha"
          staging="$HEAD-signing-$GITHUB_RUN_ID"
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/$staging" -f sha="$parent" --silent
          signed=$(bash bot/scripts/commit-payload.sh target "$REPO" "$staging" "$parent" "$message" \
            | gh api graphql --input - --jq .data.createCommitOnBranch.commit.oid) || signed=''
          gh api -X DELETE "repos/$REPO/git/refs/heads/$staging" --silent
          test -n "$signed" || { echo '::error::the signed commit could not be created; the branch is unchanged'; exit 1; }
          gh api -X PATCH "repos/$REPO/git/refs/heads/$HEAD" -f sha="$signed" -F force=true --silent
          echo 'The branch now holds one signed commit.'

      - name: Create the pull request
        if: inputs.action == 'create-pull-request'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository_owner }}/${{ inputs.repository }}
          HEAD: ${{ inputs.head }}
          BASE: ${{ inputs.base }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          LABELS: ${{ inputs.labels }}
          OWNER: ${{ github.repository_owner }}
        run: |
          test -n "$HEAD" && test -n "$BASE" && test -n "$TITLE" || { echo '::error::create-pull-request needs a head, a base and a title'; exit 1; }
          url=$(gh api "repos/$GH_REPO/pulls?head=$OWNER:$HEAD&state=open" --jq '.[0].html_url // empty')
          if [ -z "$url" ]; then
            url=$(gh api "repos/$GH_REPO/pulls" -f head="$HEAD" -f base="$BASE" -f title="$TITLE" -f body="$BODY" --jq .html_url)
            echo 'Opened the pull request.'
          else
            echo 'The pull request was already open.'
          fi
          if [ -n "$LABELS" ]; then gh pr edit "$url" --add-label "$LABELS"; fi

      - name: Comment on the issue or pull request
        if: inputs.action == 'comment'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository_owner }}/${{ inputs.repository }}
          NUMBER: ${{ inputs.number }}
          BODY: ${{ inputs.body }}
        run: |
          case "$NUMBER" in ''|*[!0-9]*) echo '::error::comment needs a numeric issue or pull request number'; exit 1;; esac
          gh issue comment "$NUMBER" --body "$BODY" > /dev/null
          echo 'Posted the comment.'
